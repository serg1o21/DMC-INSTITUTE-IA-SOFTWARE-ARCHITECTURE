<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>miStorePe, prototipo</title>
<style>
:root{
  --color-primary:#0F5C8C;--color-primary-hover:#0B4A72;--color-on-primary:#FFFFFF;
  --color-primary-container:#D3E8F5;--color-on-primary-container:#08324D;
  --color-secondary:#3F4A56;--color-accent:#C2410C;--color-on-accent:#FFFFFF;
  --color-bg:#F7F8FA;--color-surface:#FFFFFF;--color-border:#C9CFD6;--color-border-input:#8A94A0;
  --color-text:#1A1F24;--color-text-muted:#4E5965;--color-success:#15803D;--color-error:#B91C1C;
  --color-error-bg:#FDECEC;--color-warning-bg:#FEF3C7;--color-warning-text:#78350F;
  --color-info-bg:#E0F2FE;--color-info-text:#0C4A6E;--color-disabled:#6B7280;--color-skeleton:#E3E7EC;
  --focus-ring:0 0 0 3px var(--color-surface),0 0 0 5px var(--color-primary);
  --font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --font-mono:ui-monospace,"Roboto Mono",monospace;
  --fs-label-md:.75rem;--fs-body-md:.875rem;--fs-body-lg:1rem;--fs-title-lg:1.375rem;--fs-headline-sm:1.5rem;--fs-headline-md:1.75rem;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-6:24px;--sp-8:32px;
  --btn-height:48px;--btn-radius:20px;--btn-padding-x:24px;--input-height:48px;--input-radius:8px;
  --card-radius:12px;--card-padding:16px;--header-height:56px;--bottom-nav-height:64px;--sell-fab-size:56px;
  --sidebar-width:240px;--content-max:960px;--dialog-max:420px;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-primary:#7CC0EA;--color-primary-hover:#A3D4F2;--color-on-primary:#062538;
  --color-primary-container:#0F4568;--color-on-primary-container:#D3E8F5;
  --color-secondary:#B7C1CC;--color-accent:#FB8A4E;--color-on-accent:#2A0E00;
  --color-bg:#12161A;--color-surface:#1B2026;--color-border:#38414B;--color-border-input:#7D8894;
  --color-text:#E8ECF0;--color-text-muted:#AAB4BF;--color-success:#5DD58B;--color-error:#FF8A80;
  --color-error-bg:#3A1A1A;--color-warning-bg:#3D2E0A;--color-warning-text:#FBDB8C;
  --color-info-bg:#0E2C40;--color-info-text:#BDE3FA;--color-disabled:#7D8894;--color-skeleton:#2A3138;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --color-primary:#7CC0EA;--color-primary-hover:#A3D4F2;--color-on-primary:#062538;
  --color-primary-container:#0F4568;--color-on-primary-container:#D3E8F5;
  --color-secondary:#B7C1CC;--color-accent:#FB8A4E;--color-on-accent:#2A0E00;
  --color-bg:#12161A;--color-surface:#1B2026;--color-border:#38414B;--color-border-input:#7D8894;
  --color-text:#E8ECF0;--color-text-muted:#AAB4BF;--color-success:#5DD58B;--color-error:#FF8A80;
  --color-error-bg:#3A1A1A;--color-warning-bg:#3D2E0A;--color-warning-text:#FBDB8C;
  --color-info-bg:#0E2C40;--color-info-text:#BDE3FA;--color-disabled:#7D8894;--color-skeleton:#2A3138;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--color-bg);color:var(--color-text);font-family:var(--font-family);font-size:var(--fs-body-lg);line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--color-surface)}
h1{font-size:var(--fs-headline-sm);line-height:32px;font-weight:400;margin:0 0 var(--sp-4)}
h2{font-size:var(--fs-title-lg);line-height:28px;font-weight:400;margin:var(--sp-6) 0 var(--sp-3)}
h3{font-size:var(--fs-body-lg);line-height:24px;font-weight:500;margin:0}
h1:focus,h1:focus-visible{outline:none;box-shadow:none}
p{margin:0 0 var(--sp-3)}
a{color:var(--color-primary)}
.muted{color:var(--color-text-muted);font-size:var(--fs-body-md)}
.mono{font-family:var(--font-mono);font-size:var(--fs-body-md)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--color-surface);padding:8px 12px;z-index:50}
.skip:focus{left:8px}

/* Panel del prototipo */
.proto{background:var(--color-surface);border-bottom:2px dashed var(--color-accent);font-size:var(--fs-body-md)}
.proto summary{cursor:pointer;padding:10px 16px;font-weight:500;min-height:44px;display:flex;align-items:center;gap:8px}
.proto-body{display:flex;flex-wrap:wrap;gap:12px 20px;padding:0 16px 14px;align-items:flex-end}
.proto-body label{display:flex;flex-direction:column;gap:4px;font-weight:500}
.proto-body .chk{flex-direction:row;align-items:center;min-height:44px}
.proto select{height:40px;border:1px solid var(--color-border-input);border-radius:8px;background:var(--color-surface);color:var(--color-text);padding:0 8px;font:inherit;max-width:100%}
.proto-note{flex-basis:100%;color:var(--color-text-muted);margin:0}

/* Shell */
.app{display:block;min-height:calc(100vh - 44px)}
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:var(--header-height);background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-4);gap:var(--sp-3)}
.brand{font-weight:700;font-size:1.125rem;color:var(--color-primary);text-decoration:none;display:flex;align-items:center;gap:8px;min-height:44px}
.brand svg{width:26px;height:26px}
.hello{color:var(--color-text-muted);font-size:var(--fs-body-md);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
main{padding:var(--sp-4);padding-bottom:calc(var(--bottom-nav-height) + 96px);max-width:var(--content-max);margin:0 auto}
main.public{padding-bottom:var(--sp-8);max-width:440px}
.offline{background:var(--color-warning-bg);color:var(--color-warning-text);padding:10px 16px;font-size:var(--fs-body-md);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--color-surface);border-top:1px solid var(--color-border);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom,0px))}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;color:var(--color-text-muted);text-decoration:none;font:500 var(--fs-label-md)/16px var(--font-family);background:none;border:0;cursor:pointer;padding:0}
.bnav svg{width:24px;height:24px}
.bnav [aria-current="page"]{color:var(--color-primary)}
.bnav [aria-current="page"] svg{background:var(--color-primary-container);border-radius:12px;padding:2px 10px;width:44px;height:28px;color:var(--color-on-primary-container)}
.bnav .sell span.fab{width:var(--sell-fab-size);height:var(--sell-fab-size);border-radius:18px;background:var(--color-accent);color:var(--color-on-accent);display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.bnav .sell{color:var(--color-text)}
.bnav .sell[aria-current="page"] svg{background:none;padding:0;width:24px;height:24px;color:inherit}
.line .row,.card .row,.card-link .row{flex-wrap:nowrap}
.line h3,.card h3{min-width:0;overflow-wrap:anywhere}
.side{display:none}
@media (min-width:1024px){
  .bnav{display:none}
  .layout{display:grid;grid-template-columns:var(--sidebar-width) 1fr}
  .side{display:flex;flex-direction:column;gap:2px;padding:var(--sp-4) var(--sp-3);border-right:1px solid var(--color-border);background:var(--color-surface);min-height:calc(100vh - var(--header-height));position:sticky;top:var(--header-height);align-self:start}
  .side a,.side button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-radius:24px;color:var(--color-text);text-decoration:none;font:500 var(--fs-body-md)/20px var(--font-family);background:none;border:0;cursor:pointer;text-align:left}
  .side a[aria-current="page"]{background:var(--color-primary-container);color:var(--color-on-primary-container)}
  .side .sell-side{background:var(--color-accent);color:var(--color-on-accent);margin:4px 0 12px;height:56px}
  .side svg{width:22px;height:22px;flex:none}
  .side hr{border:0;border-top:1px solid var(--color-border);width:100%;margin:8px 0}
  main{padding:var(--sp-6);padding-bottom:var(--sp-8)}
  h1{font-size:var(--fs-headline-md);line-height:36px}
}

/* Botones M3 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--btn-height);padding:0 var(--btn-padding-x);border-radius:var(--btn-radius);font:500 var(--fs-body-md)/20px var(--font-family);border:1px solid transparent;cursor:pointer;text-decoration:none;background:none;color:var(--color-primary);position:relative}
.btn:hover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:.08;pointer-events:none}
.btn:active::after{opacity:.12}
.btn.filled{background:var(--color-primary);color:var(--color-on-primary)}
.btn.accent{background:var(--color-accent);color:var(--color-on-accent)}
.btn.tonal{background:var(--color-primary-container);color:var(--color-on-primary-container)}
.btn.outlined{border-color:var(--color-border-input);color:var(--color-primary)}
.btn.text{min-height:44px;padding:0 12px}
.btn.danger{background:var(--color-error);color:#fff}
.btn.danger-outlined{border-color:var(--color-error);color:var(--color-error)}
.btn.icon{width:44px;min-height:44px;padding:0;border-radius:22px}
.btn svg{width:20px;height:20px;flex:none}
.btn.icon svg{width:24px;height:24px}
.btn.block{width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.38;cursor:not-allowed}
.btn[aria-disabled="true"]::after,.btn:disabled::after{display:none}
.actions{display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-4)}
.actions.end{justify-content:flex-end}
@media (max-width:599px){.actions.stack{flex-direction:column-reverse}.actions.stack .btn{width:100%}}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap}

/* Formularios */
.field{margin-bottom:var(--sp-4)}
.field>label,.lbl{display:block;font-weight:500;margin-bottom:6px}
.opt{font-weight:400;color:var(--color-text-muted)}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:var(--input-height);border:1px solid var(--color-border-input);border-radius:var(--input-radius);padding:0 12px;font:inherit;background:var(--color-surface);color:var(--color-text)}
textarea{padding:12px;min-height:96px;resize:vertical}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--color-error);border-width:2px}
.help{font-size:var(--fs-label-md);color:var(--color-text-muted);margin-top:4px;line-height:16px}
.err{font-size:var(--fs-body-md);color:var(--color-error);margin-top:4px;font-weight:500}
.err:empty{display:none}
.prefix{display:flex;align-items:stretch}
.prefix span{display:flex;align-items:center;padding:0 12px;border:1px solid var(--color-border-input);border-right:0;border-radius:var(--input-radius) 0 0 var(--input-radius);background:var(--color-bg);color:var(--color-text-muted)}
.prefix input{border-radius:0 var(--input-radius) var(--input-radius) 0}
.pw{display:flex;gap:8px}
.pw input{flex:1}
.check{display:flex;gap:12px;align-items:flex-start;min-height:44px}
.check input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--color-primary)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{width:90px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr;gap:0 var(--sp-3)}
@media (min-width:600px){.grid2{grid-template-columns:1fr 1fr}}
fieldset{border:0;padding:0;margin:0 0 var(--sp-4)}
legend{font-weight:500;margin-bottom:8px;padding:0}
.radio-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.radio-cards label{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border:1px solid var(--color-border-input);border-radius:12px;cursor:pointer;font-weight:500;padding:0 8px;text-align:center}
.radio-cards input{accent-color:var(--color-primary);width:20px;height:20px;margin:0}
.radio-cards label:has(input:checked){border:2px solid var(--color-primary);background:var(--color-primary-container);color:var(--color-on-primary-container)}

/* Contenido */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--card-radius);padding:var(--card-padding)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-3)}
.card-link{display:block;text-decoration:none;color:inherit;min-height:64px;cursor:pointer;width:100%;text-align:left;font:inherit;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--card-radius);padding:var(--card-padding)}
.card-link:hover{border-color:var(--color-border-input)}
.tight{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--color-border);border-radius:var(--card-radius);background:var(--color-surface);overflow:hidden}
.tight>li+li{border-top:1px solid var(--color-border)}
.tight .card-link{border:0;border-radius:0;min-height:56px;padding:10px 16px}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font:500 var(--fs-label-md)/16px var(--font-family);background:var(--color-bg);border:1px solid var(--color-border);color:var(--color-text-muted);white-space:nowrap}
.badge.ok{background:var(--color-primary-container);color:var(--color-on-primary-container);border-color:transparent}
.badge.bad{background:var(--color-error-bg);color:var(--color-error);border-color:transparent}
.badge.void{text-decoration:none}
.pos{color:var(--color-success);font-weight:500}
.neg{color:var(--color-error);font-weight:500}
.strike{text-decoration:line-through;color:var(--color-text-muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:var(--sp-3) 0}
.chip{min-height:36px;padding:0 14px;border:1px solid var(--color-border-input);border-radius:8px;background:none;color:var(--color-text);font:500 var(--fs-body-md)/20px var(--font-family);cursor:pointer;position:relative}
.chip::before{content:"";position:absolute;inset:-4px 0}
.chip[aria-checked="true"]{background:var(--color-primary-container);color:var(--color-on-primary-container);border-color:transparent}
.tabs{display:flex;border-bottom:1px solid var(--color-border);margin-bottom:var(--sp-4)}
.tabs button{flex:1;min-height:48px;background:none;border:0;border-bottom:3px solid transparent;font:500 var(--fs-body-md)/20px var(--font-family);color:var(--color-text-muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--color-primary);border-bottom-color:var(--color-primary)}
.banner{border-radius:12px;padding:12px 16px;margin-bottom:var(--sp-4);font-size:var(--fs-body-md)}
.banner.info{background:var(--color-info-bg);color:var(--color-info-text)}
.banner.warn{background:var(--color-warning-bg);color:var(--color-warning-text)}
.banner.error{background:var(--color-error-bg);color:var(--color-error)}
.banner ul{margin:4px 0 0;padding-left:20px}
.empty{text-align:center;padding:var(--sp-8) var(--sp-4);border:1px dashed var(--color-border-input);border-radius:var(--card-radius)}
.empty svg{width:56px;height:56px;color:var(--color-text-muted)}
.skel{background:var(--color-skeleton);border-radius:12px;height:76px}
@media (prefers-reduced-motion:no-preference){.skel{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.5}}
.back{margin:-8px 0 8px -12px}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--color-text-muted);font-size:var(--fs-body-md)}
.big{font-size:var(--fs-headline-md);line-height:36px}
.stats{display:grid;grid-template-columns:1fr;gap:var(--sp-3)}
@media (min-width:600px){.stats{grid-template-columns:repeat(3,1fr)}}
.stats.two{grid-template-columns:1fr 1fr}
.stats.two .big{font-size:var(--fs-title-lg);line-height:28px;white-space:nowrap}
.stock-n{text-align:right;min-width:72px}
.stock-n strong{display:block;font-size:var(--fs-title-lg);font-weight:400;line-height:28px}
.zone{border:1px solid var(--color-error);border-radius:var(--card-radius);padding:var(--card-padding);margin-top:var(--sp-6)}
section.card{margin-bottom:var(--sp-4)}
section.card h2{margin-top:0}
.legal h2{font-size:1.125rem;margin-top:var(--sp-4)}
.logo-c{text-align:center;margin:var(--sp-6) 0 var(--sp-4)}
.logo-c svg{width:48px;height:48px;color:var(--color-primary)}

/* Venta rápida */
.search-big input{min-height:52px;font-size:1.0625rem}
.results{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--color-border);border-radius:12px;background:var(--color-surface);overflow:hidden}
.results:empty{display:none}
.results li+li{border-top:1px solid var(--color-border)}
.res{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px 8px 16px;background:none;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.res:hover{background:var(--color-bg)}
.res[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.res .plus{width:44px;height:44px;border-radius:22px;background:var(--color-primary-container);color:var(--color-on-primary-container);display:flex;align-items:center;justify-content:center;flex:none}
.line{background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;padding:12px 16px}
.line.has-err{border:2px solid var(--color-error)}
.line-ctrls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:8px}
.line-ctrls .prefix{width:150px}
.salebar{position:fixed;left:0;right:0;bottom:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom,0px));z-index:4;background:var(--color-surface);border-top:1px solid var(--color-border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.salebar .total{font-size:var(--fs-title-lg)}
@media (min-width:1024px){.salebar{left:var(--sidebar-width);bottom:0}}

/* Diálogo y toast */
dialog{border:0;border-radius:28px;padding:24px;max-width:min(var(--dialog-max),calc(100vw - 32px));width:100%;background:var(--color-surface);color:var(--color-text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin-top:0;font-size:var(--fs-headline-sm);line-height:32px}
.sheet a,.sheet button.sheet-item{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 8px;color:var(--color-text);text-decoration:none;border-radius:12px;background:none;border:0;width:100%;font:inherit;cursor:pointer;text-align:left}
.sheet a:hover,.sheet button.sheet-item:hover{background:var(--color-bg)}
.sheet svg{width:22px;height:22px;color:var(--color-text-muted)}
.sheet h3{font-size:var(--fs-body-md);color:var(--color-text-muted);margin:12px 8px 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bottom-nav-height) + 84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--color-text);color:var(--color-bg);padding:12px 18px;border-radius:8px;max-width:calc(100vw - 32px);width:max-content;font-size:var(--fs-body-md);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.toast:empty{display:none}
@media (min-width:1024px){.toast{bottom:96px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main-content" data-act="skip">Saltar al contenido</a>
<details class="proto" id="proto">
  <summary>Controles del prototipo (no forman parte de la app)</summary>
  <div class="proto-body">
    <label>Pantalla <select id="pScreen"></select></label>
    <label>Estado de los datos
      <select id="pState"><option value="data">Con datos</option><option value="empty">Vacío</option><option value="loading">Cargando</option><option value="error">Error</option></select>
    </label>
    <label class="chk"><input type="checkbox" id="pShould"> Funciones Should activas (inicio con dashboard)</label>

/* Campos de variante */
function variantFields(cat,v,i){
 const id=k=>`v${i}-${k}`;
 const price=`<div class="field"><label for="${id('price')}">Precio de venta</label><div class="prefix"><span>S/</span><input id="${id('price')}" name="${id('price')}" data-vf="price" data-idx="${i}" type="text" inputmode="decimal" value="${esc(v.price??'')}"></div>${fieldErr(id('price'))}</div>`;
 if(cat==='CLOTHING')return `<div class="grid2"><div class="field"><label for="${id('size')}">Talla</label><input id="${id('size')}" name="${id('size')}" data-vf="size" data-idx="${i}" type="text" maxlength="11" autocapitalize="characters" value="${esc(v.size||'')}">${fieldErr(id('size'))}</div><div class="field"><label for="${id('color')}">Color</label><input id="${id('color')}" name="${id('color')}" data-vf="color" data-idx="${i}" type="text" maxlength="31" value="${esc(v.color||'')}">${fieldErr(id('color'))}</div></div>${price}`;
 if(cat==='PERFUME')return `<div class="grid2"><div class="field"><label for="${id('ml')}">Presentación (ml)</label><input id="${id('ml')}" name="${id('ml')}" data-vf="ml" data-idx="${i}" type="text" inputmode="numeric" value="${esc(v.ml??'')}">${fieldErr(id('ml'))}</div><div class="field"><label for="${id('exp')}">Vencimiento <span class="opt">(opcional)</span></label><input id="${id('exp')}" name="${id('exp')}" data-vf="exp" data-idx="${i}" type="date" value="${esc(v.exp||'')}">${fieldErr(id('exp'))}</div></div>${price}`;
 return `<div class="grid2"><div class="field"><label for="${id('size')}">Talla <span class="opt">(opcional)</span></label><input id="${id('size')}" name="${id('size')}" data-vf="size" data-idx="${i}" type="text" maxlength="11" value="${esc(v.size||'')}">${fieldErr(id('size'))}</div><div class="field"><label for="${id('color')}">Color <span class="opt">(opcional)</span></label><input id="${id('color')}" name="${id('color')}" data-vf="color" data-idx="${i}" type="text" maxlength="31" value="${esc(v.color||'')}">${fieldErr(id('color'))}</div></div>${price}`;
}
function validateVariant(cat,raw,others,i){
 const e={},k=f=>`v${i}-${f}`;const n={size:'',color:'',ml:null,exp:null,isSingle:false};
 if(cat==='CLOTHING'){n.size=String(raw.size||'').trim().toUpperCase();n.color=cap(raw.color||'');
  if(!n.size)e[k('size')]='Ingresa la talla';else if(n.size.length>10)e[k('size')]='La talla tiene máximo 10 caracteres';
  if(!n.color)e[k('color')]='Ingresa el color';else if(n.color.length>30)e[k('color')]='El color tiene máximo 30 caracteres';}
 else if(cat==='PERFUME'){const ml=parseInt0(raw.ml);if(isNaN(ml)||ml<1||ml>9999)e[k('ml')]='Ingresa una presentación entera entre 1 y 9,999 ml';else n.ml=ml;
  if(raw.exp){if(!/^\d{4}-\d{2}-\d{2}$/.test(raw.exp))e[k('exp')]='Usa una fecha válida';else n.exp=raw.exp}}
 else{n.size=String(raw.size||'').trim().toUpperCase();n.color=cap(raw.color||'');if(n.size.length>10)e[k('size')]='La talla tiene máximo 10 caracteres';if(n.color.length>30)e[k('color')]='El color tiene máximo 30 caracteres';n.isSingle=!n.size&&!n.color}
 const p=parseMoney(raw.price);if(isNaN(p)||p<0.01||p>99999.99)e[k('price')]='Ingresa un precio entre S/ 0.01 y S/ 99,999.99';else n.price=p;
 const key=x=>cat==='CLOTHING'?x.size+'|'+x.color:cat==='PERFUME'?x.ml+'|'+(x.exp||''):(x.isSingle?'U':x.size+'|'+x.color);
 if(!Object.keys(e).length&&others.some(o=>key(o)===key(n)))e[k(cat==='PERFUME'?'ml':cat==='CLOTHING'?'size':'price')]=n.isSingle?'Ya existe la variante Única en este producto':'Esta variante ya existe en el producto';
 return {e,n};
}
function newSku(cat){const pre=catPrefix[cat];DB.counters[pre]++;return `${pre}-${String(DB.counters[pre]).padStart(5,'0')}`}

/* Buscador de variantes */
function searchV(q,opts={}){
 const t=norm(q).split(/\s+/).filter(Boolean);if(!t.length)return[];
 return allV().filter(({v,p})=>(opts.inactive||p.active)&&t.every(w=>norm([p.name,v.sku,v.size,v.color,v.ml?v.ml+' ml':'',v.isSingle?'unica':''].join(' ')).includes(w))).slice(0,8);
}

/* P-010 Historial de ventas */
const saleTotals=s=>{const a=s.lines.filter(l=>l.status==='ACTIVE');return{amount:a.reduce((x,l)=>x+l.price*l.qty,0),profit:a.reduce((x,l)=>x+(l.price-l.cost)*l.qty,0),allAmount:s.lines.reduce((x,l)=>x+l.price*l.qty,0),allProfit:s.lines.reduce((x,l)=>x+(l.price-l.cost)*l.qty,0)}};
const profitCls=n=>r2(n)<0?'neg':'pos';
V.sales=()=>{
 const g=stateGate('tus ventas');
 const list=(isEmpty()?[]:DB.sales).filter(s=>s.saleAt.slice(0,10)>=S.salesFrom&&s.saleAt.slice(0,10)<=S.salesTo&&(S.salesStatus==='ALL'||s.status===S.salesStatus)).sort((a,b)=>b.saleAt.localeCompare(a.saleAt));
 let body;
 if(g)body=g;
 else if(isEmpty())body=empty('Aún no registras ventas','Cuando vendas en un live, registra la venta para descontar el stock.',`<a class="btn filled" href="#sale">Registrar venta</a>`);
 else if(!list.length)body='<p class="muted">No hay ventas en ese rango.</p>';
 else body=`<ul class="list">${list.map(s=>{const t=saleTotals(s);const v=s.status==='VOIDED';const n=s.lines.reduce((a,l)=>a+l.qty,0);return `<li><button class="card-link" data-act="openSale" data-id="${s.id}">
  <div class="row"><h3>${fdt(s.saleAt)}</h3><span class="badge ${v?'':'ok'}">${v?'Anulada':'Vigente'}</span></div>
  <div class="muted">${n} ${n===1?'producto':'productos'}, total <span class="${v?'strike':''}">${money(v?t.allAmount:t.amount)}</span></div>
  <div>Ganancia ${v?`<span class="strike">${money(t.allProfit)}</span> <span class="muted">(no suma)</span>`:`<span class="${profitCls(t.profit)}">${money(t.profit)}</span>`}</div></button></li>`}).join('')}</ul>`;
 return `<h1>Historial de ventas</h1>
 <div class="grid2"><div class="field"><label for="sf">Desde</label><input id="sf" type="date" value="${S.salesFrom}" data-in="salesFrom"></div><div class="field"><label for="stt">Hasta</label><input id="stt" type="date" value="${S.salesTo}" data-in="salesTo"></div></div>
 <div class="field" style="max-width:280px"><label for="ss">Estado</label><select id="ss" data-in="salesStatus"><option value="ALL" ${S.salesStatus==='ALL'?'selected':''}>Todas</option><option value="ACTIVE" ${S.salesStatus==='ACTIVE'?'selected':''}>Vigentes</option><option value="VOIDED" ${S.salesStatus==='VOIDED'?'selected':''}>Anuladas</option></select></div>
 ${body}`;
};

/* P-011 Detalle de venta */
function voidBlock(s,lineVids){
 if(ts(NOW)-ts(s.createdAt)>86400000)return 'Ya pasó el plazo de 24 horas para anular';
 const vids=lineVids||s.lines.filter(l=>l.status==='ACTIVE').map(l=>l.vid);
 for(const id of vids){const {v}=findV(id);if(v.moves.some(m=>m.type==='ADJ'&&m.createdAt>s.createdAt))return 'No se puede anular: hay un ajuste de stock posterior a esta venta'}
 return '';
}
V['sale-detail']=()=>{
 const s=findS(S.saleId);if(!s)return V['not-found']();
 const g=stateGate('la venta');if(g)return backLink('sales','Volver al historial')+'<h1>Venta</h1>'+g;
 const t=saleTotals(s),voided=s.status==='VOIDED',blk=voided?'':voidBlock(s);
 const deadline=new Date(ts(s.createdAt)+86400000-5*3600000).toISOString().slice(0,16).replace('T',' ');
 return `${backLink('sales','Volver al historial')}
 <div class="row"><h1 style="margin:0">Venta del ${fdt(s.saleAt)}</h1><span class="badge ${voided?'':'ok'}">${voided?'Anulada':'Vigente'}</span></div>
 <p class="muted" style="margin-top:8px">Registrada el ${fdt(s.createdAt)}.${!voided&&!blk?` Puedes anular hasta el ${fdt(deadline)}.`:''}</p>
 <ul class="list">${s.lines.map(l=>{const {v,p}=findV(l.vid);const lv=l.status==='VOIDED';const pr=(l.price-l.cost)*l.qty;const lb=lv||voided?'':voidBlock(s,[l.vid]);return `<li class="card">
  <div class="row"><h3>${esc(fullLabel(v,p))}</h3><span class="badge ${lv?'':'ok'}">${lv?'Anulada':'Vigente'}</span></div>
  <div class="kv"><span>${l.qty} x ${money(l.price)}</span><span>Costo ${money(l.cost)}</span></div>
  <div class="row" style="margin-top:4px"><span>Ganancia <span class="${lv?'strike':profitCls(pr)}">${money(pr)}</span></span>${!lv&&!voided&&!lb?`<button class="btn text" data-act="voidLine" data-id="${l.id}">Anular línea</button>`:''}</div>
 </li>`}).join('')}</ul>
 <div class="card" style="margin-top:16px"><div class="row"><span>Total</span><strong>${money(voided?0:t.amount)}</strong></div><div class="row"><span>Ganancia</span><strong class="${profitCls(t.profit)}">${money(voided?0:t.profit)}</strong></div></div>

};

function lastSale(p){const ids=new Set(p.variants.map(v=>v.id));const d=DB.sales.flatMap(s=>s.lines.filter(l=>l.status==='ACTIVE'&&ids.has(l.vid)).map(()=>s.saleAt)).sort().pop();return d||p.histLastSale||null}

 return `<h1>Productos sin movimiento</h1><p class="muted">Productos activos sin ventas en los últimos 30 días. Úsalo para decidir qué no volver a comprar.</p>

/* P-020 Ganancias */
function period(){
 if(S.profitMode==='week'){const d=new Date(TODAY+'T12:00:00Z');const dow=(d.getUTCDay()+6)%7;const start=addDays(TODAY,-dow+7*S.profitOffset);return{from:start,to:addDays(start,6),label:`${fday(start)} al ${fday(addDays(start,6))}`}}
 const d=new Date(Date.UTC(2026,10+S.profitOffset,1));const from=d.toISOString().slice(0,10);const e=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).toISOString().slice(0,10);
 const m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getUTCMonth()];return{from,to:e,label:`${m} de ${d.getUTCFullYear()}`};
}
function periodTotals(pr){let a=0,c=0;for(const s of DB.sales){const d=s.saleAt.slice(0,10);if(d<pr.from||d>pr.to)continue;for(const l of s.lines)if(l.status==='ACTIVE'){a+=l.price*l.qty;c+=l.cost*l.qty}}return{a,c,g:a-c}}

 ${g||`<div class="stats"><div class="card"><div class="muted">Ventas</div><div class="big">${money(t.a)}</div></div><div class="card"><div class="muted">Costo</div><div class="big">${money(t.c)}</div></div><div class="card"><div class="muted">Ganancia</div><div class="big ${profitCls(t.g)}">${money(t.g)}</div></div></div>
 ${t.a===0?'<p class="muted" style="margin-top:16px">No hay ventas en este periodo.</p>':''}
 <p class="muted" style="margin-top:16px">No incluye ventas anuladas ni ajustes de stock.</p>`}`;
};

async function trySale(confirm){
 const btn=app.querySelector('[data-act="submitSale"]');
 S.cart.forEach(l=>l.err='');document.getElementById('date-err').textContent='';
 let ok=true;
 for(const l of S.cart){const {v,p}=findV(l.vid);const pr=parseMoney(l.price);
  if(!Number.isInteger(l.qty)||l.qty<1||l.qty>9999){l.err='Ingresa una cantidad entre 1 y 9,999';ok=false}
  else if(isNaN(pr)||pr<0.01||pr>99999.99){l.err='Ingresa un precio entre S/ 0.01 y S/ 99,999.99, con máximo 2 decimales';ok=false}
  else if(!p.active){l.err='Reactiva el producto para venderlo';ok=false}
  else if(expired(v)){l.err='Este perfume está vencido y no se puede vender';ok=false}
  else if(l.qty>v.stock){l.err='Stock insuficiente: '+unitsLeft(v.stock);ok=false}}
 let saleAt=NOW;
 if(S.saleDate==='other'){saleAt=`${S.saleDay} ${S.saleTime}`;if(!S.saleDay||!S.saleTime||S.saleDay<addDays(TODAY,-7)||ts(saleAt)>ts(NOW)){render();document.getElementById('date-err').textContent='Elige una fecha de los últimos 7 días y una hora que no sea futura';return}}
 if(!ok){render();const f=app.querySelector('.line.has-err input');f&&f.focus();return}
 const loss=S.cart.reduce((a,l)=>{const {v}=findV(l.vid);const pr=parseMoney(l.price);return a+(pr<v.avg?(v.avg-pr)*l.qty:0)},0);
 if(r2(loss)>0&&!confirm){openDialog(`<h2 id="dlg-title">La venta genera una pérdida</h2><p>Esta venta genera una pérdida de ${money(loss)}.</p>${dlgBtns('Registrar igual','danger','Volver')}`,()=>{setTimeout(()=>trySale(true),0)});return}
 const done=busy(btn,'Registrando…');
 if(S.offline){await wait(600);done();S.pendingSale={confirm};render();return}
 await wait(500);
 if(S.dataState==='error'){done();render();return}
 const id=DB.nextSale++;const created=NOW;
 const s={id,saleAt,createdAt:created,status:'ACTIVE',lines:S.cart.map((l,i)=>{const {v}=findV(l.vid);return{id:id*10+i,vid:l.vid,qty:l.qty,price:parseMoney(l.price),cost:v.avg||0,status:'ACTIVE'}})};
 const msgs=[];for(const l of s.lines){const {v,p}=findV(l.vid);v.stock-=l.qty;addMove(v,{type:'SALE',createdAt:created,qty:-l.qty,saleId:id,lineId:l.id});msgs.push(`${esc(vLabel(v,p))}: ${unitsLeft(v.stock)}`)}
 DB.sales.push(s);S.cart=[];S.saleQ='';S.saleDate='now';
 S.lastSaleMsg=`<strong>Venta registrada.</strong> ${msgs.join('. ')}. <a href="#sale-detail" data-act="openSale" data-id="${id}">Ver venta</a>`;
 toast('Venta registrada');render();document.getElementById('sq').focus();
}

  const show=m=>{box.innerHTML=`<div class="banner error">${m}</div>`};
  const done=busy(btn,'Entrando…');await wait(500);done();
  if(S.offline){show('No pudimos conectar. Revisa tu conexión.');return}
  if(email==='sergio@mistore.pe'){S.logged=true;S.role='ADMIN';S.loginBanner='';go('admin');return}
  if(email==='luis@gmail.com'){show('Tu cuenta está suspendida por falta de pago');return}
  if(email==='cerrada@gmail.com'&&pw==='TiendaLima2026'){S.closedReason='USER';S.loginBanner='';go('closed');return}
  if(email==='ana@gmail.com'){
   if(S.locked){show('Demasiados intentos. Intenta de nuevo en 15 minutos');return}
   if(pw===S.password&&S.anaClosed){S.failed=0;S.closedReason='USER';S.loginBanner='';go('closed');return}
   if(pw===S.password){S.failed=0;S.logged=true;S.role='ENT';S.loginBanner='';S.user.email='ana@gmail.com';go(homeRoute());return}
   S.failed++;if(S.failed>=5){S.locked=true;show('Demasiados intentos. Intenta de nuevo en 15 minutos');return}
  }
  show('Correo o contraseña incorrectos'+(email==='ana@gmail.com'?` <span class="muted">(prototipo: intento fallido ${S.failed} de 5)</span>`:''));
 },
 'product-new'(f,btn){
  const d=S.draft,e={};if(!d.cat){e.cat='Elige una categoría';setErr(f,'cat',e.cat);summary(f,e);return}
  d.name=f.name.value;const nm=d.name.trim();if(!nm||nm.length>100)e.name='El nombre debe tener entre 1 y 100 caracteres';
  const norms=[];d.variants.forEach((raw,i)=>{const r=validateVariant(d.cat,raw,norms,i);Object.assign(e,r.e);if(!Object.keys(r.e).length)norms.push(r.n)});
  if(!d.variants.length)e.v='Agrega al menos una variante';
  f.querySelectorAll('[name]').forEach(i=>{if(i.type!=='radio')setErr(f,i.name,e[i.name])});summary(f,e);
  if(Object.keys(e).length){const x=f.querySelector('[aria-invalid="true"]');x&&x.focus();return}
  const p={id:++seq,name:nm,cat:d.cat,active:true,variants:norms.map(n=>mkV(++seq,newSku(d.cat),Object.assign(n,{stock:0,avg:null})))};
  DB.products.push(p);S.draft=null;S.productId=p.id;toast(`Producto creado. SKU asignados: ${p.variants.map(v=>v.sku).join(', ')}`);go('product');
 },
 'variant-edit'(f){
  const {v,p}=findV(S.variantId),e={};
  const pr=parseMoney(f.price.value);if(isNaN(pr)||pr<0.01||pr>99999.99)e.price='Ingresa un precio entre S/ 0.01 y S/ 99,999.99';
  let n=null;
  if(!v.moves.length){const raw={price:f.price.value};f.querySelectorAll('[data-vf]').forEach(i=>raw[i.dataset.vf]=i.value);if(f.exp)raw.exp=f.exp.value;
   const r=validateVariant(p.cat,raw,p.variants.filter(x=>x!==v),0);delete r.e['v0-price'];Object.assign(e,r.e);n=r.n}
  else if(p.cat==='PERFUME'&&f.exp.value!==(v.exp||'')&&p.variants.some(x=>x!==v&&x.ml===v.ml&&(x.exp||'')===f.exp.value))e.exp='Ya existe esa presentación con ese vencimiento';
  let min=v.min;if(f.min){min=parseInt0(f.min.value);if(isNaN(min)||min>9999)e.min='Ingresa un entero entre 0 y 9,999'}
  f.querySelectorAll('[name]').forEach(i=>setErr(f,i.name,e[i.name]));summary(f,e);if(Object.keys(e).length)return;
  if(n)Object.assign(v,{size:n.size,color:n.color,ml:n.ml??v.ml,isSingle:n.isSingle});
  if(f.exp)v.exp=f.exp.value||null;v.price=pr;v.min=min;toast(pr<v.avg?'Cambios guardados. El precio es menor que el costo.':'Cambios guardados');go('product');
 },
 async entry(f,btn){
  const e={};const sel=S.entryVid?findV(S.entryVid):null;
  if(!sel)e.variant='Elige una variante';
  const q=parseInt0(f.qty.value);if(isNaN(q)||q<1||q>9999)e.qty='Ingresa una cantidad entera entre 1 y 9,999';
  const c=parseMoney(f.cost.value);if(isNaN(c)||c<0.01||c>99999.99)e.cost='Ingresa un costo entre S/ 0.01 y S/ 99,999.99, con máximo 2 decimales';
  if(sel&&!sel.p.active)e.variant='Reactiva el producto para registrar mercadería';
  ['qty','cost'].forEach(k=>setErr(f,k,e[k]));document.getElementById('variant-err').textContent=e.variant||'';summary(f,e);if(Object.keys(e).length)return;
  const done=busy(btn,'Registrando…');await wait(450);done();
  if(S.offline||S.dataState==='error'){summary(f,{x:'Sin conexión. La entrada no se registró; intenta de nuevo.'});return}
  const {v}=sel;const prev=hasEntries(v)?v.avg:null;v.avg=r2((v.stock*(prev||0)+q*c)/(v.stock+q));v.stock+=q;addMove(v,{type:'ENTRY',createdAt:NOW,qty:q,cost:c,prevAvg:prev});
  toast(`Entrada registrada. Stock: ${v.stock}. Costo promedio: ${money(v.avg)}`);render();document.getElementById('en-qty').focus();
 },
 adjust(f){
  const {v}=findV(S.variantId),e={};const q=parseInt0(f.counted.value);const r=f.reason.value;
  if(isNaN(q)||q<0||q>9999)e.counted='Ingresa un entero entre 0 y 9,999';
  else if(q>v.stock&&!v.moves.some(m=>m.type==='ENTRY'&&m.status==='ACTIVE'))e.counted='Registra primero una entrada con su costo';
  if(!r.trim())e.reason='Escribe el motivo del ajuste';else if(r.length>200)e.reason='El motivo tiene máximo 200 caracteres';
  ['counted','reason'].forEach(k=>setErr(f,k,e[k]));summary(f,e);if(Object.keys(e).length)return;
  const diff=q-v.stock;addMove(v,{type:'ADJ',createdAt:NOW,qty:diff,reason:r.trim()});v.stock=q;toast(`Ajuste registrado. Diferencia ${diff>0?'+':''}${diff}`);go('variant');
 },
 name(f){const n=f.name.value.trim();if(n.length>100){setErr(f,'name','El nombre tiene máximo 100 caracteres');return}setErr(f,'name','');S.user.name=n;render();toast('Nombre guardado')},
 password(f){const e={};if(!f.current.value)e.current='Ingresa tu contraseña actual';else if(f.current.value!==S.password)e.current='La contraseña actual no es correcta';
  const n=f.newpw.value;if(n.length<12||n.length>128)e.newpw='La contraseña debe tener entre 12 y 128 caracteres';
  ['current','newpw'].forEach(k=>setErr(f,k,e[k]));summary(f,e);if(Object.keys(e).length)return;S.password=n;f.reset();toast('Contraseña cambiada. Cerramos tus otras sesiones.')},
 forgot(f){const em=f.email.value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){setErr(f,'email','Revisa el correo');return}setErr(f,'email','');document.getElementById('fg-msg').innerHTML='<div class="banner info">Si el correo tiene una cuenta, te enviamos un enlace válido por 30 minutos.</div>'}
};
app.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();FORM[f.dataset.form](f,e.submitter||f.querySelector('[type=submit]'))});

/* ============ Panel del prototipo ============ */
const pScreen=document.getElementById('pScreen'),pState=document.getElementById('pState'),pShould=document.getElementById('pShould'),pOffline=document.getElementById('pOffline'),pTheme=document.getElementById('pTheme');
const groups=[['Must',s=>!/\((Should|Could)\)/.test(s[1])],['Should y Could',s=>/\((Should|Could)\)/.test(s[1])]];
pScreen.innerHTML=groups.map(([g,fn])=>`<optgroup label="${g}">${SCREENS.filter(fn).map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</optgroup>`).join('');
pScreen.addEventListener('change',()=>{prepRoute(pScreen.value);if(pScreen.value==='closed')S.closedReason='USER';go(pScreen.value)});
pState.addEventListener('change',()=>{S.dataState=pState.value;render()});
pShould.addEventListener('change',()=>{S.should=pShould.checked;render()});
pOffline.addEventListener('change',()=>{S.offline=pOffline.checked;render()});
pTheme.addEventListener('change',()=>{if(pTheme.value)document.documentElement.dataset.theme=pTheme.value;else delete document.documentElement.dataset.theme});

/* Inicio */
const start=location.hash.slice(1);
if(start&&SCREENS.some(s=>s[0]===start)){prepRoute(start);S.route=start}
render();
</script>
